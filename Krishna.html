<!DOCTYPE html>
<html lang="en">
<head>

  <!-- High-Contrast Classical Serif Font matching the reference typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>

  <!-- SVG Filter: Pavan (Wind) na lidhe Morpankh na tana halta dekhay te mate -->
  <svg class="svg-filters" aria-hidden="true">
    <defs>
      <filter id="wind-ripple" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.014 0.035" numOctaves="2" seed="8" result="noise" />
        <feDisplacementMap id="displacement" in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

                fill="#9aa5b8" opacity="0.75" />

      </div>

      <!-- LAYER 2: Top Navbar (Golden Emblem, Divider Line & Search / Audio / Profile Icons) -->
      <header class="layer-slice slice-navbar" id="sliceNavbar">
        <svg class="navbar-svg" viewBox="0 0 1920 108" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="navGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fae596" />
              <stop offset="50%" stop-color="#d4af62" />
              <stop offset="100%" stop-color="#9e762c" />

            <path d="M1732 44 C 1735 47, 1735 55, 1732 58" />
            <path d="M1736 39 C 1741 45, 1741 57, 1736 63" />

            <circle cx="1796" cy="43" r="7.5" />
            <path d="M1782 65 C 1782 56, 1810 56, 1810 65" />

          <line x1="0" y1="104" x2="1920" y2="104" stroke="#d4af62" stroke-opacity="0.18" stroke-width="1" />
        </svg>
      </header>

      <section class="layer-slice slice-title" id="sliceTitle">
        <div class="title-content">
          <h1 class="hero-heading">
            <span class="heading-line-1">JAI SHREE</span>
            <span class="heading-line-2">RADHEKRISHN</span>
          </h1>
          <!-- Warm Golden Horizon Flare underneath "RADHEKRISHN" -->
          <div class="title-underglow"></div>
          <!-- Shimmer Sweep Layer for the 1.5s–3.0s Reveal -->
          <div class="title-shimmer" id="titleShimmer"></div>
        </div>
      </section>

      <!-- LAYER 4: Play & Arrow Pill Buttons -->
      <div class="layer-slice slice-buttons" id="sliceButtons">
        <button class="pill-btn play-pill" id="replayBtn" title="Replay Wind Animation" aria-label="Replay Animation">
          <svg viewBox="0 0 36 36" class="pill-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="11,7 28,18 11,29" stroke="#e5c172" stroke-width="2" stroke-linejoin="round" />
          </svg>
        </button>

        <button class="pill-btn arrow-pill" id="enterBtn" title="Enter" aria-label="Enter">
          <svg viewBox="0 0 44 36" class="pill-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="6" y1="18" x2="36" y2="18" stroke="#e5c172" stroke-width="2" stroke-linecap="round" />
            <polyline points="26,9 36,18 26,27" stroke="#e5c172" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <!-- Top-right Speaker Icon Clickable Hotspot for Replaying -->
      <button class="hotspot-btn audio-hotspot" id="audioBtn" title="Replay Animation" aria-label="Audio / Replay"></button>

        <!-- 5A: Complete Radha-Krishna Line-Art Illustration & Glowing Pink-Gold Lotus -->

          <svg class="rk-illustration-svg" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">

                <stop offset="100%" stop-color="#9b7228" />

                <stop offset="100%" stop-color="#1e3a63" stop-opacity="0.4" />

                <stop offset="55%" stop-color="#0d2246" stop-opacity="0.72" />

                <stop offset="100%" stop-color="#061024" stop-opacity="0" />

                <stop offset="55%" stop-color="#c93b72" stop-opacity="0.78" />
                <stop offset="100%" stop-color="#5e1b42" stop-opacity="0.65" />

                 3. THE GOLDEN BANSURI (FLUTE) & TASSELS

  <!-- GSAP & MotionPathPlugin CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>

  <script>
    gsap.registerPlugin(MotionPathPlugin);

    // =========================================================================
    // 1. GOLDEN WIND PARTICLES & BREEZE STREAKS ON CANVAS
    // =========================================================================
    const canvas = document.getElementById('windCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let windPower = 0;

    function resizeCanvas() {
      const board = document.getElementById('artboard');
      width = canvas.width = board.clientWidth;
      height = canvas.height = board.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const dustParticles = Array.from({ length: 55 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.8 + 0.6,
      vx: Math.random() * 0.5 + 0.2,
      vy: (Math.random() - 0.5) * 0.35,
      alpha: Math.random() * 0.75 + 0.2,
      phase: Math.random() * Math.PI * 2
    }));

    const windLines = Array.from({ length: 16 }, () => ({
      x: Math.random() * width - width,
      y: Math.random() * height,
      len: Math.random() * 220 + 110,
      speed: Math.random() * 15 + 10,
      curve: (Math.random() - 0.5) * 40,
      alpha: Math.random() * 0.35 + 0.12
    }));

    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);

      // Floating Golden Sparkles
      dustParticles.forEach(p => {
        p.phase += 0.03;
        p.x += p.vx + windPower * 11;
        p.y += p.vy - windPower * 2 + Math.sin(p.phase) * 0.25;

        if (p.x > width + 15) p.x = -15;
        if (p.y < -15) p.y = height + 15;
        if (p.y > height + 15) p.y = -15;

        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(250, 226, 156, ${p.alpha * (0.5 + 0.5 * Math.sin(p.phase))})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#f5d061';
        ctx.fill();
        ctx.restore();
      });

      // Wind Gust Lines during Morpankh Flight
      if (windPower > 0.02) {
        windLines.forEach(w => {
          w.x += w.speed * (0.4 + windPower * 1.6);
          w.y -= windPower * 1.5;
          if (w.x > width + w.len) {
            w.x = -w.len - Math.random() * 160;
            w.y = Math.random() * height;
          }

          const grad = ctx.createLinearGradient(w.x, w.y, w.x + w.len, w.y + w.curve);
          grad.addColorStop(0, 'rgba(250, 226, 156, 0)');
          grad.addColorStop(0.5, `rgba(0, 245, 212, ${w.alpha * windPower})`);
          grad.addColorStop(0.85, `rgba(250, 226, 156, ${w.alpha * windPower})`);
          grad.addColorStop(1, 'rgba(250, 226, 156, 0)');

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(w.x, w.y);
          ctx.quadraticCurveTo(w.x + w.len * 0.5, w.y + w.curve, w.x + w.len, w.y - w.curve * 0.35);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.restore();
        });
      }

      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    // =========================================================================
    // 2. MORPANKH REVERSE-ANCHOR FULL-SCREEN TO KRISHNA'S CROWN ANIMATION
    // =========================================================================
    const morpankhAnchor = document.getElementById('morpankhAnchor');
    const morpankhVector = document.getElementById('morpankhVector');
    const morpankhHalo = document.getElementById('morpankhHalo');
    const titleShimmer = document.getElementById('titleShimmer');
    const displacement = document.getElementById('displacement');

    let tl;
    let idleCrownTween;
    let idleGlowTween;

    function runMorpankhSequence() {
      if (tl) tl.kill();
      if (idleCrownTween) idleCrownTween.kill();
      if (idleGlowTween) idleGlowTween.kill();

      // Step 1: Reset Morpankh to its exact resting anchor on Krishna's crown (x: 0, y: 0, scale: 1)
      // to dynamically measure the exact viewport offset across any screen size.
      gsap.set(morpankhAnchor, {
        x: 0,
        y: 0,
        z: 0,
        scale: 1,
        rotationZ: 0,
        rotationX: 0,
        rotationY: 0
      });

      const boardRect = document.getElementById('artboard').getBoundingClientRect();
      const featherRect = morpankhAnchor.getBoundingClientRect();

      const featherCenterX = featherRect.left + featherRect.width / 2;
      const featherCenterY = featherRect.top + featherRect.height / 2;

      const screenCenterX = boardRect.left + boardRect.width / 2;
      const screenCenterY = boardRect.top + boardRect.height / 2;

      // Dynamic Reverse-Anchor Offset: distance from Krishna's crown to viewport center
      const deltaX = screenCenterX - featherCenterX;
      const deltaY = screenCenterY - featherCenterY;

      // Full-screen scale so the Morpankh covers the entire viewport at 0.0s
      const fullScreenScale = Math.max(
        boardRect.width / featherRect.width,
        boardRect.height / featherRect.height
      ) * 1.45;

      tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

      // Initial States: Hide Title, Buttons, Navbar, and Radha-Krishna
      gsap.set(['#sliceNavbar', '#sliceButtons'], { autoAlpha: 0, y: 14 });
      gsap.set('#sliceTitle', {
        autoAlpha: 0,
        y: 22,
        filter: 'blur(14px) brightness(1.75)'
      });
      gsap.set(titleShimmer, { xPercent: -130, autoAlpha: 0.95 });
      gsap.set('#sliceRK', { autoAlpha: 0, scale: 0.96, filter: 'blur(8px)' });
      gsap.set(morpankhHalo, { autoAlpha: 0.25, scale: 0.75 });
      gsap.set(morpankhVector, {
        autoAlpha: 1,
        filter: 'url(#wind-ripple) drop-shadow(0 0 8px rgba(0, 245, 212, 0.35))'
      });

      // Place Morpankh at full-screen center using reverse-anchor offsets
      gsap.set(morpankhAnchor, {
        x: deltaX,
        y: deltaY + 20,
        z: 180,
        scale: fullScreenScale,
        rotationZ: 34,
        rotationX: 12,
        rotationY: -14,
        autoAlpha: 1
      });

      // 0.0s – 0.85s: Gentle full-screen breathing before wind gust sweeps it back
      tl.to(morpankhAnchor, {
        duration: 0.85,
        scale: fullScreenScale * 0.93,
        rotationZ: 26,
        ease: 'sine.inOut'
      }, 0);

      // 0.6s – 3.5s: Wind Gust turbulence rises and settles
      tl.to({ p: 0 }, {
        p: 1,
        duration: 1.0,
        ease: 'power2.in',
        onUpdate: function () {
          windPower = this.targets()[0].p;
          displacement.setAttribute('scale', 6 + windPower * 18);
        }
      }, 0.6);

      tl.to({ p: 1 }, {
        p: 0,
        duration: 1.9,
        ease: 'power3.out',
        onUpdate: function () {
          windPower = this.targets()[0].p;
          displacement.setAttribute('scale', 2 + windPower * 16);
        }
      }, 1.6);

      // 0.8s – 3.6s: 3D Backward Flight along curved S-path to x: 0, y: 0, scale: 1 on Krishna's Crown
      tl.to(morpankhAnchor, {
        duration: 2.8,
        motionPath: {
          path: [
            { x: deltaX * 0.62 - 90, y: deltaY * 0.45 - 80 },
            { x: deltaX * 0.22 + 70, y: deltaY * 0.12 - 50 },
            { x: -14, y: -22 },
            { x: 0, y: 0 }
          ],
          curviness: 1.5
        },
        z: 0,
        scale: 1,
        rotationZ: 0,
        ease: 'power3.inOut'
      }, 0.8);

      // Mid-air 3D pitch & roll in the wind
      tl.to(morpankhAnchor, {
        duration: 1.05,
        rotationY: 32,
        rotationX: -22,
        ease: 'sine.inOut'
      }, 0.9);

      tl.to(morpankhAnchor, {
        duration: 1.65,
        rotationY: 0,
        rotationX: 0,
        ease: 'power2.out'
      }, 1.95);

      // =======================================================================
      // THE REVEAL (1.5s – 3.0s)
      // =======================================================================
      // 1.5s – 2.75s: "JAI SHREE RADHEKRISHN" reveals with golden shimmer & blur-to-clear
      tl.to('#sliceTitle', {
        duration: 1.25,
        autoAlpha: 1,
        y: 0,
        filter: 'blur(0px) brightness(1)',
        ease: 'power3.out'
      }, 1.5);

      tl.to(titleShimmer, {
        duration: 1.35,
        xPercent: 140,
        autoAlpha: 0,
        ease: 'power2.inOut'
      }, 1.5);

      // 1.75s – 3.0s: Pill Buttons, Navbar, and Radha-Krishna illustration fade in
      tl.to('#sliceRK', {
        duration: 1.25,
        autoAlpha: 1,
        scale: 1,
        filter: 'blur(0px)',
        ease: 'power2.out'
      }, 1.75);

      tl.to(['#sliceButtons', '#sliceNavbar'], {
        duration: 1.05,
        autoAlpha: 1,
        y: 0,
        stagger: 0.15,
        ease: 'power2.out'
      }, 1.95);

      // =======================================================================
      // THE LANDING (3.2s – 4.0s)
      // =======================================================================
      // 3.25s – 4.0s: Trigger soft cyan/emerald radial glow + drop-shadow on Krishna's Crown
      tl.to(morpankhHalo, {
        duration: 0.75,
        autoAlpha: 0.95,
        scale: 1.08,
        ease: 'back.out(1.6)'
      }, 3.25);

      tl.to(morpankhVector, {
        duration: 0.75,
        filter: 'url(#wind-ripple) drop-shadow(0 0 18px rgba(0, 245, 212, 0.82))',
        ease: 'power2.out',
        onComplete: startGentleCrownSway
      }, 3.25);
    }

    // Subtle idle breathing / fluttering animation once landed on Krishna's crown
    function startGentleCrownSway() {
      idleCrownTween = gsap.to(morpankhAnchor, {
        rotationZ: 2.2,
        y: -2,
        scale: 1.018,
        duration: 2.6,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });

      idleGlowTween = gsap.to(morpankhHalo, {
        autoAlpha: 0.65,
        scale: 0.96,
        duration: 2.6,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });
    }

    window.addEventListener('load', runMorpankhSequence);
    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    document.getElementById('replayBtn').addEventListener('click', runMorpankhSequence);
    document.getElementById('audioBtn').addEventListener('click', runMorpankhSequence);
  </script>
</body>
</html>
