      <div class="scene" id="scene">

        <!-- =====================================================
             ARTWORK (SWAP POINT)
             This is Radha-Krishna and the glowing lotus, extracted from
             your reference at its exact size and position.
             To use your own artwork, replace Claude.png with
             a transparent PNG or WebP of the same size (1125 x 1160 px), or

             ===================================================== -->

          <img class="art" id="art" src="Claude.png" width="1125" height="1160" alt="" />

            <defs>
              <mask id="maskRadha" maskUnits="userSpaceOnUse" x="0" y="0" width="1125" height="1160">

                <stop offset="0.42" stop-color="#ffd27a" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff3c8" stop-opacity="1" />
                <stop offset="0.58" stop-color="#ffd27a" stop-opacity="0" />
                <stop offset="1" stop-color="#ffd27a" stop-opacity="0" />
                <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 600" dur="4.2s" repeatCount="indefinite" />
              </linearGradient>
              <linearGradient id="bandBlue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="600" spreadMethod="repeat" gradientTransform="translate(0 0)">
                <stop offset="0" stop-color="#7fc4ff" stop-opacity="0" />
                <stop offset="0.42" stop-color="#7fc4ff" stop-opacity="0" />
                <stop offset="0.5" stop-color="#eaf7ff" stop-opacity="1" />
                <stop offset="0.58" stop-color="#7fc4ff" stop-opacity="0" />
                <stop offset="1" stop-color="#7fc4ff" stop-opacity="0" />
                <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 600" dur="4.2s" begin="-2.1s" repeatCount="indefinite" />
              </linearGradient>
              <filter id="glowBloom" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="bloom" />
                <feMerge>
                  <feMergeNode in="bloom" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <g filter="url(#glowBloom)">
              <!-- a steady warm halo on each figure -->
              <g mask="url(#maskRadha)"><rect width="1125" height="1160" fill="#ffd27a" fill-opacity="0.2" /></g>
              <g mask="url(#maskKrishna)"><rect width="1125" height="1160" fill="#7fc4ff" fill-opacity="0.2" /></g>

              <g class="band" mask="url(#maskKrishna)"><rect width="1125" height="1160" fill="url(#bandBlue)" /></g>
            </g>

  <!-- GSAP and MotionPathPlugin via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>

  <script>
  (function () {
    'use strict';

    /* ---------- constants (measured from the reference image) ---------- */
    var CAP_H = 122;          // cap height of the title, px
    var LINE2_W = 1206;       // width of RADHEKRISHN, px
    var LINE_GAP = 183;       // baseline to baseline, px
    var BASELINE_1 = 666;     // baseline of JAI SHREE, px

    /* ---------- the morpankh: one spin on the way in, then it rests on the crown ---------- */
    var FLIGHT = 3.2;                                              // seconds for the spin and the landing
    var FINAL_ROT = -12;                                           // resting tilt on the crown, degrees
    var START = { x: -560, y: 170, scale: 3.4, rotationZ: -50 };   // start, as offsets from the crown (px)
    var APEX = { x: -230, y: -90 };                                // top of the arc, as offsets from the crown (px)

    var root = document.documentElement;
    var $ = function (sel) { return document.querySelector(sel); };

    var nav = $('#nav');
    var title = $('#title');
    var titleShine = $('#titleShine');
    var shineLines = titleShine.querySelectorAll('.line');
    var underglow = $('#underglow');
    var introCover = $('#introCover');
    var pills = $('#pills');
    var artStage = $('#artStage');
    var figureGlow = $('#figureGlow');
    var feather = $('#feather');
    var featherGlow = $('#featherGlow');
    var replayBtn = $('#replayBtn');
    var audioBtn = $('#audioBtn');

    var hasGSAP = typeof window.gsap !== 'undefined';
    var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    /* ---------- stage fit: cover the screen, keep the reference layout ---------- */
    function fitStage() {
      var k = Math.max(window.innerWidth / 2752, window.innerHeight / 1536);
      root.style.setProperty('--k', k.toFixed(5));
    }

    /* ---------- title: match the reference cap height, width and baseline ---------- */
    function fitTitle() {
      var fam = "Cinzel, 'Cormorant Garamond', Georgia, 'Times New Roman', serif";
      var c = document.createElement('canvas').getContext('2d');

      c.font = '500 200px ' + fam;
      var capRatio = (c.measureText('H').actualBoundingBoxAscent || 140) / 200;
      var fs = CAP_H / capRatio;

      c.font = '500 ' + fs + 'px ' + fam;
      var natural = c.measureText('RADHEKRISHN').width;
      var sx = LINE2_W / natural;

      var m = c.measureText('H');
      var asc = m.fontBoundingBoxAscent || fs * 0.9;
      var desc = m.fontBoundingBoxDescent || fs * 0.25;
      var halfLead = (LINE_GAP - (asc + desc)) / 2;
      var top = BASELINE_1 - (halfLead + asc);

      root.style.setProperty('--t-fs', fs.toFixed(2) + 'px');
      root.style.setProperty('--t-sx', sx.toFixed(4));
      root.style.setProperty('--t-lh', LINE_GAP + 'px');
      root.style.setProperty('--t-top', top.toFixed(2) + 'px');
    }

    /* ---------- sound (created on the first click; browsers block audio before that) ---------- */
    var audioCtx = null;
    var soundOn = true;

    function ensureAudio() {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function whoosh() {
      if (!soundOn || !audioCtx || audioCtx.state !== 'running') return;
      var ac = audioCtx;
      var dur = 2.6;
      var now = ac.currentTime;
      var buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

      var src = ac.createBufferSource();
      src.buffer = buf;
      var bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = 0.9;
      bp.frequency.setValueAtTime(220, now);
      bp.frequency.exponentialRampToValueAtTime(2400, now + dur * 0.8);
      var gain = ac.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.9);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(bp);
      bp.connect(gain);
      gain.connect(ac.destination);
      src.start(now);
      src.stop(now + dur);
    }

    function toggleSound() {
      soundOn = !soundOn;
      if (soundOn) ensureAudio();
      audioBtn.setAttribute('data-muted', String(!soundOn));
      audioBtn.setAttribute('aria-label', soundOn ? 'Mute sound' : 'Unmute sound');
    }

    /* ---------- the sequence ---------- */
    var tl = null;

    function play() {
      if (tl) tl.kill();
      feather.classList.remove('landed');

      // 0 s: everything starts hidden, the morpankh starts off-screen to the left
      gsap.set(introCover, { opacity: 0 });
      gsap.set([nav, pills], { opacity: 0 });
      gsap.set(artStage, { opacity: 0, scale: 1.04 });
      gsap.set(figureGlow, { opacity: 0 });
      gsap.set(title, { opacity: 0, y: 24 });
      gsap.set(titleShine, { opacity: 0 });
      gsap.set(underglow, { opacity: 0 });
      gsap.set(featherGlow, { opacity: 0 });
      gsap.set(feather, {
        x: START.x, y: START.y, scale: START.scale, rotationZ: START.rotationZ,
        rotationX: 0, rotationY: 0, opacity: 1, transformOrigin: '50% 50%'
      });

      tl = gsap.timeline({ defaults: { ease: 'power2.out' } });
      tl.call(whoosh, null, 0);

      // the flight: one spin, a rise over the top, then the landing on the crown
      tl.to(feather, { x: APEX.x, y: APEX.y, duration: FLIGHT * 0.55, ease: 'sine.out' }, 0)
        .to(feather, { x: 0, y: 0, duration: FLIGHT * 0.45, ease: 'sine.inOut' }, FLIGHT * 0.55)
        .to(feather, { scale: 1, rotationZ: FINAL_ROT, duration: FLIGHT, ease: 'power2.out' }, 0)
        .to(feather, { rotationY: 360, duration: FLIGHT, ease: 'power1.inOut' }, 0)
        .set(feather, { rotationY: 0 }, FLIGHT)                       // a full turn looks the same as none
        .to(feather, { scale: 1.03, duration: 0.2, ease: 'sine.out' }, FLIGHT)
        .to(feather, { scale: 1, duration: 0.35, ease: 'sine.inOut' }, FLIGHT + 0.2);

      // the reveal of the title, the artwork, the glow and the navbar
      tl.fromTo(title, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 2.4, ease: 'power2.out' }, 2.6)
        .fromTo(titleShine, { opacity: 1 }, { opacity: 0, duration: 2.6, ease: 'power1.inOut' }, 2.6)
        .fromTo(shineLines, { backgroundPosition: '100% 50%' }, { backgroundPosition: '0% 50%', duration: 2.6, ease: 'power2.inOut' }, 2.6)
        .fromTo(artStage, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 2.4, ease: 'power2.out' }, 3.0)
        .fromTo(nav, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 1.6, ease: 'power2.out' }, 3.6)
        .fromTo(underglow, { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 2.0, ease: 'sine.out' }, 3.6)
        .fromTo(pills, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 1.6, ease: 'power2.out' }, 3.9)
        .fromTo(figureGlow, { opacity: 0 }, { opacity: 1, duration: 2.4, ease: 'sine.out' }, 4.2)
        .call(function () { root.classList.remove('js-intro'); }, null, 4.4);

      // landed: the feather stays still on the crown; only its glow goes on and off
      tl.to(featherGlow, { opacity: 1, duration: 1.0, ease: 'sine.out' }, FLIGHT - 0.2)
        .call(function () { feather.classList.add('landed'); }, null, FLIGHT + 0.55);
    }

    // used when GSAP is missing or the visitor prefers reduced motion: show the finished page
    function showFinal() {
      root.classList.remove('js-intro');
      feather.classList.add('landed');
      featherGlow.style.opacity = '0.8';
      if (reduceMotion) figureGlow.classList.add('reduced');
    }

    function replay() {
      if (!hasGSAP || reduceMotion) return;
      ensureAudio();
      play();
    }

    /* ---------- start ---------- */
    function init() {
      fitStage();
      window.addEventListener('resize', fitStage);

      audioBtn.addEventListener('click', toggleSound);
      replayBtn.addEventListener('click', replay);

      var fontsReady = (document.fonts && document.fonts.load)
        ? Promise.all([document.fonts.load('500 120px Cinzel'), document.fonts.ready]).catch(function () {})
        : Promise.resolve();

      fontsReady.then(function () {
        fitTitle();
        if (!hasGSAP || reduceMotion) {
          showFinal();
          return;
        }
        // wait two frames so the layout is settled before measuring
        requestAnimationFrame(function () {
          requestAnimationFrame(play);
        });
      });
    }

    init();
  })();
  </script>
  </body>
</html>
